          <p>
            Ihr Link zum Zurücksetzen des Passworts funktioniert leider nicht. Dies kann mehrere Gründe haben:
          </p>
          <ul>
            <li>
              Ihr Link ist abgelaufen. Links zum Zurücksetzen des Passworts sind <em>nur 24 Stunden gültig</em>.
            </li>
            <li>
              <em>Bitte bedenken Sie, dass Links zum Zurücksetzen des Passworts nur einmal
              verwendet werden können.</em> Sie können <a href="%{url}">einen neuen Link
