          text: "Ich erlaube, dass openHPI das von mir angegebene Benutzerprofil speichert. Teile des Profils können von anderen Nutzern der Plattform in Foren oder anderen kollaborativen Funktionen eingesehen werden. Dies umfasst den <i>Klarnamen</i>, sofern kein expliziter <i>Anzeigename</i> gesetzt wird, sowie ein optionales Profilfoto. Meinen Anzeigenamen kann ich jederzeit in meinen Profileinstellungen festlegen oder ändern."
