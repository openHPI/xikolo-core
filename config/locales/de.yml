              zu Ihrem Konto erlangt haben könnte.
            </li>
            <li>
              <em>Der eigegebene Link könnte unvollständig sein.</em> Bitte stellen Sie sicher,
              dass Sie die komplette URL kopiert haben. Ihr E-Mail-Client könnte den Link über
              mehrere Zeilen umgebrochen haben.
            </li>
