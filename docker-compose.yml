---
# ### DEVELOPMENT ###
#
# Runs all needed external services via docker on locally bound ports.
#

services:
  postgres:
    image: postgres:16.0-bullseye
    restart: always
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: $USER
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
    healthcheck:
      test: pg_isready
      interval: 10s
      timeout: 3s
      retries: 3

  minio:
    image: minio/minio
    command: server /data
    volumes:
      - minio:/data
    ports:
      - 127.0.0.1:9000:9000
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

volumes:
  postgres:
  minio:
